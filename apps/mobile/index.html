<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#5B132B"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>AASHIMA Atelier | Android ERP POS</title>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"/>
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CDN with exact Stitch Regal Atelier Tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3d0017",
            "on-primary": "#ffffff",
            "primary-container": "#5b132b",
            "on-primary-container": "#db7991",
            "primary-fixed": "#ffd9df",
            "primary-fixed-dim": "#ffb1c2",
            "secondary": "#8e495d",
            "on-secondary": "#ffffff",
            "secondary-container": "#ffa9bf",
            "on-secondary-container": "#7b3a4e",
            "secondary-fixed": "#ffd9e1",
            "secondary-fixed-dim": "#ffb1c5",
            "tertiary": "#261800",
            "on-tertiary": "#ffffff",
            "tertiary-container": "#402c00",
            "on-tertiary-container": "#ba9142",
            "tertiary-fixed": "#ffdea7",
            "tertiary-fixed-dim": "#edc06c",
            "surface": "#fff8f8",
            "surface-dim": "#e3d7da",
            "surface-bright": "#fff8f8",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#fdf0f3",
            "surface-container": "#f8ebed",
            "surface-container-high": "#f2e5e8",
            "surface-container-highest": "#ecdfe2",
            "on-surface": "#201a1c",
            "on-surface-variant": "#544245",
            "outline": "#867275",
            "outline-variant": "#d9c1c4",
            "surface-tint": "#974259",
            "error": "#ba1a1a",
            "on-error": "#ffffff",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "background": "#fff8f8",
            "on-background": "#201a1c",
            "success": "#1E7B4D"
          },
          fontFamily: {
            "serif": ["Playfair Display", "serif"],
            "sans": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
    }

    /* Emulator Device Outer Styling on Desktop */
    @media (min-width: 641px) {
      .android-chassis {
        border: 12px solid #221c1e;
        border-radius: 46px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
        height: 870px;
        max-height: 92vh;
      }
    }
    @media (max-width: 640px) {
      .emulator-decor {
        display: none !important;
      }
      .android-chassis {
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        height: 100vh !important;
        max-height: 100vh !important;
        width: 100vw !important;
      }
    }
  </style>
</head>
<body class="bg-[#181114] text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 selection:bg-primary-container selection:text-white">

  <!-- Desktop Emulator Toolbar Header -->
  <header class="emulator-decor w-full max-w-4xl mx-auto mb-3 px-4 py-2 rounded-2xl bg-[#241a1e]/90 border border-outline-variant/20 backdrop-blur-md flex items-center justify-between shadow-lg text-white">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-primary-container text-tertiary-fixed flex items-center justify-center shadow">
        <span class="material-symbols-outlined text-[18px]">phone_android</span>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-xs tracking-wide">AASHIMA Android POS</span>
          <span class="px-1.5 py-0.2 rounded bg-tertiary-fixed/20 text-tertiary-fixed text-[9px] font-mono font-bold">Android 14 API 34</span>
        </div>
        <span class="text-[10px] text-white/60">390 × 844 dp • Turab Nagar Atelier Shift Counter</span>
      </div>
    </div>

    <!-- Quick Navigation Hub -->
    <div class="flex items-center gap-2 text-xs">
      <a href="/admin" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 font-semibold flex items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[15px]">dashboard</span>
        <span>Admin Dashboard</span>
      </a>

      <a href="/" target="_blank" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 font-semibold flex items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[15px]">public</span>
        <span>Customer Portal</span>
      </a>

      <a href="/api/docs" target="_blank" class="hidden sm:flex px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 font-semibold items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[15px]">api</span>
        <span>Swagger API</span>
      </a>

      <button onclick="window.location.reload()" title="Reload Emulator" class="w-7 h-7 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors">
        <span class="material-symbols-outlined text-[16px]">sync</span>
      </button>
    </div>
  </header>

  <!-- Android Device Chassis -->
  <div class="relative w-full max-w-[420px] bg-surface flex flex-col overflow-hidden android-chassis">

    <!-- Android Top Bezel: Punch-hole camera notch & speaker -->
    <div class="emulator-decor relative w-full pt-1.5 pb-0.5 bg-surface-container-lowest flex flex-col items-center z-50 shrink-0 border-b border-outline-variant/20 select-none">
      <!-- Punch Hole Camera -->
      <div class="w-3.5 h-3.5 rounded-full bg-black flex items-center justify-center shadow-inner">
        <div class="w-1 h-1 rounded-full bg-[#1a3848]"></div>
      </div>

      <!-- Android System Status Bar -->
      <div class="w-full px-5 py-1 flex items-center justify-between text-[11px] font-bold text-on-surface select-none">
        <span id="android-clock" class="font-sans">10:30</span>
        <div class="flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[14px]">signal_cellular_alt</span>
          <span class="text-[9px] font-mono">5G</span>
          <span class="material-symbols-outlined text-[14px]">wifi</span>
          <div class="flex items-center gap-0.5">
            <span class="text-[9px] font-mono">98%</span>
            <span class="material-symbols-outlined text-[15px] rotate-90">battery_full</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Screen Scrollable Viewport -->
    <div id="screen-container" class="flex-1 flex flex-col overflow-y-auto no-scrollbar pb-16 bg-surface">
      <!-- Loading Initializer -->
      <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
        <div class="w-10 h-10 rounded-full border-4 border-primary-container border-t-transparent animate-spin mb-3"></div>
        <span class="font-serif text-primary text-xl font-bold">AASHIMA</span>
        <span class="text-[10px] uppercase tracking-widest text-secondary mt-1 font-semibold">Women's World & Stitchers 'N' Drapers</span>
      </div>
    </div>

    <!-- Persistent Bottom Navigation Bar -->
    <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-surface-container-lowest/95 backdrop-blur-md border-t border-outline-variant/40 px-2 py-1.5 flex items-center justify-around z-40 shadow-[0_-2px_10px_rgba(91,19,43,0.06)] hidden">
      <button onclick="window.navigateTo('dashboard')" class="nav-item flex flex-col items-center gap-0.5 py-1 px-2.5 rounded-lg text-primary font-bold" data-screen="dashboard">
        <span class="material-symbols-outlined text-[22px]">dashboard</span>
        <span class="text-[10px] tracking-tight">Atelier</span>
      </button>

      <button onclick="window.navigateTo('new-booking')" class="nav-item flex flex-col items-center gap-0.5 py-1 px-2.5 rounded-lg text-on-surface-variant hover:text-primary transition-colors" data-screen="new-booking">
        <span class="material-symbols-outlined text-[22px]">add_circle</span>
        <span class="text-[10px] tracking-tight">Intake</span>
      </button>

      <!-- Center Elevated QR Scanner Button -->
      <button onclick="window.navigateTo('qr-scan')" class="relative -top-3.5 w-12 h-12 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-lg active:scale-95 transition-transform border-2 border-surface" data-screen="qr-scan" aria-label="Scan Garment QR">
        <span class="material-symbols-outlined text-[26px] text-tertiary-fixed">qr_code_scanner</span>
      </button>

      <button onclick="window.navigateTo('orders')" class="nav-item flex flex-col items-center gap-0.5 py-1 px-2.5 rounded-lg text-on-surface-variant hover:text-primary transition-colors" data-screen="orders">
        <span class="material-symbols-outlined text-[22px]">inventory_2</span>
        <span class="text-[10px] tracking-tight">Orders</span>
      </button>

      <button onclick="window.navigateTo('departments')" class="nav-item flex flex-col items-center gap-0.5 py-1 px-2.5 rounded-lg text-on-surface-variant hover:text-primary transition-colors" data-screen="departments">
        <span class="material-symbols-outlined text-[22px]">precision_manufacturing</span>
        <span class="text-[10px] tracking-tight">Floor</span>
      </button>
    </nav>

    <!-- Bottom Android Gesture Bar Pill -->
    <div class="emulator-decor absolute bottom-0.5 left-1/2 -translate-x-1/2 w-28 h-1 bg-black/30 rounded-full pointer-events-none z-50"></div>

    <!-- Hidden Thermal Print Target -->
    <div id="print-area" class="hidden font-mono text-xs p-4 whitespace-pre-wrap"></div>
  </div>

  <!-- Realtime Android Clock Script -->
  <script>
    function updateClock() {
      const now = new Date();
      const el = document.getElementById('android-clock');
      if (el) {
        el.innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: false });
      }
    }
    updateClock();
    setInterval(updateClock, 10000);
  </script>

  <!-- Main Mobile App Logic -->
  <script src="./src/main.js"></script>
</body>
</html>
